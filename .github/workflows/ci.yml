# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `dev`, so the workflow had never run on a push to it.
#   - the test job ran the starter's placeholder echo; there is no test of any
#     kind in this repository, so a real smoke test was added instead
#     (tests/smoke_test.sh) and wired in below.
#   - added an actual build job. The starter shipped none: `lint` only checks
#     that actions are pinned, and the placeholder `test` job never compiled
#     anything.
#   - the build step removes PreLoad.cmake before configuring. That file
#     forces CMAKE_GENERATOR to "MinGW Makefiles" for every fresh build
#     directory (CACHE INTERNAL FORCE); confirmed locally that `cmake -S . -B
#     build` fails immediately with a generator mismatch on a runner without
#     MinGW, and that removing the file first lets it configure and build
#     cleanly with the default generator. It is a Windows/MinGW-only local
#     preference, not something the code needs, so removing it for CI does
#     not change what is being tested.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          rm -f PreLoad.cmake
          cmake -S . -B build
          cmake --build build

      - name: Test
        run: bash tests/smoke_test.sh build
